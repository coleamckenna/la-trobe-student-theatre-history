name: Verify export/build round-trip

on:
  push:
    branches: [main]
    paths:
      - "framework/catalog/**"
      - "catalog/**"
      - "scripts/build.sh"
      - "scripts/export.sh"
      - "scripts/verify-roundtrip.sh"
  schedule:
    - cron: "0 9 * * 0"
  workflow_dispatch:

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fossil
          pip install pyyaml

      - name: Pull canonical database from Fossil
        env:
          FOSSIL_REPO_URL: ${{ secrets.FOSSIL_REPO_URL }}
        run: |
          if [[ -z "$FOSSIL_REPO_URL" ]]; then
            echo "Error: FOSSIL_REPO_URL secret is not set" >&2
            exit 1
          fi
          fossil clone "$FOSSIL_REPO_URL" _fossil_checkout
          cp _fossil_checkout/ltst.sqlite ltst.sqlite

      - name: Export, rebuild, and verify
        env:
          CATALOG_INSTANCE: config/instance.yaml
        run: |
          python3 framework/catalog/export.py \
            --config config/instance.yaml \
            --db ltst.sqlite \
            --catalog /tmp/ltst-exported
          python3 framework/catalog/build.py \
            --config config/instance.yaml \
            --catalog /tmp/ltst-exported \
            --db /tmp/ltst-rebuilt.sqlite
          python3 framework/catalog/verify_roundtrip.py \
            --source ltst.sqlite \
            --rebuilt /tmp/ltst-rebuilt.sqlite
