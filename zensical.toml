[project]
site_name = "LTUST Production Wiki"
site_description = "Searchable wiki for La Trobe University Student Theatre production metadata."
site_author = "La Trobe University Student Theatre metadata contributors"
docs_dir = "docs"
site_dir = "site"
watch = [
  "CONTENT-NOTICE.md",
  "README.md",
  "productions",
  "scripts/build_wiki.py",
]
nav = [
  { "Home" = "index.md" },
  { "Browse productions" = "productions/index.md" },
  { "Browse categories" = "categories/index.md" },
  { "Data guide" = "data-guide.md" },
  { "Content notice" = "content-notice.md" },
]
extra_css = ["stylesheets/extra.css"]

[project.theme]
variant = "modern"
features = [
  "navigation.sections",
  "navigation.indexes",
  "navigation.path",
  "navigation.prune",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]
